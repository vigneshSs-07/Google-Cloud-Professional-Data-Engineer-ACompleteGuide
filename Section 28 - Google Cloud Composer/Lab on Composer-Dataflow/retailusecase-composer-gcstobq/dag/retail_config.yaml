# Configuration for the Retail Sales GCS to BQ pipeline

gcp_project_id: "poised-team-467209-a1"
gcp_region: "us-central1" 

gcs_staging_bucket: "gs://poised-team-467209-a1-data-bucket/"
gcs_beam_script_path: "/home/airflow/gcs/data/gcs_to_bq_beam.py"
gcs_input_file: "gs://poised-team-467209-a1-data-bucket/incoming/retail_data.csv"
gcs_error_output_prefix: "gs://poised-team-467209-a1-data-bucket/errors/bad_records"

bq_output_table_dataset: "retail_dataset"
bq_output_table_name: "sales_summary_data"

# BigQuery Table Schema
bq_table_schema:
  fields:
    - name: 'product_name'
      type: 'STRING'
    - name: 'category'
      type: 'STRING'
    - name: 'quantity'
      type: 'INTEGER'
    - name: 'price'
      type: 'FLOAT'
    - name: 'customer_id'
      type: 'STRING'
    - name: 'store_id'
      type: 'STRING'
    - name: 'total_amount'
      type: 'FLOAT'
    - name: 'sales_category'
      type: 'STRING'